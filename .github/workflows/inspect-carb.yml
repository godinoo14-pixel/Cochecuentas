name: Inspeccionar carburantes
on:
  push:
    paths: ['.github/workflows/inspect-carb.yml']
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" -H "Accept: application/json" -o c.json "https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/"
          ls -la c.json
          python3 -c "
          import json;d=json.load(open('c.json',encoding='utf-8-sig'))
          print([k for k in d if k!='ListaEESSPrecio'], d.get('Fecha'), d.get('ResultadoConsulta'))
          L=d['ListaEESSPrecio'];print(len(L));print(json.dumps(L[0],ensure_ascii=False,indent=0))
          import collections;print(collections.Counter(x['Provincia'] for x in L).most_common(5))"
